$kind: http-request
url: "{{baseUrl}}/api/admin/clients"
method: GET
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{clientToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Statut 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 4000
