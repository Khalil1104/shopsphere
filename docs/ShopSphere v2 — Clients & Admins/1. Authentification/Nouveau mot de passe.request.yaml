$kind: http-request
description: "Copiez le token du lien reçu par e-mail dans la variable resetToken (ou cliquez le lien : un formulaire s'ouvre)."
url: "{{baseUrl}}/api/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "token": "{{resetToken}}",
      "type": "client",
      "password": "Nouveau2026X",
      "confirmPassword": "Nouveau2026X"
    }
order: 8000
