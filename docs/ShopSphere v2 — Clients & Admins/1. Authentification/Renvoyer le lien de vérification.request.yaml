$kind: http-request
url: "{{baseUrl}}/api/auth/resend-verification"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{clientEmail}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('Statut 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 6000
