$kind: http-request
url: "{{baseUrl}}/api/auth/me"
method: GET
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{clientToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Statut 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 6000
