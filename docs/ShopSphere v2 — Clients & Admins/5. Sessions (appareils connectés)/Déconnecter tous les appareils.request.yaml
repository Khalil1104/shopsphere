$kind: http-request
url: "{{baseUrl}}/api/auth/logout-all"
method: POST
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{clientToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Statut 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 8000
