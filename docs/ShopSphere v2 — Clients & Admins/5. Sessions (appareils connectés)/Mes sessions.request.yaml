$kind: http-request
url: "{{baseUrl}}/api/auth/sessions"
method: GET
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{clientToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Statut 200', () => pm.response.to.have.status(200));
      pm.test('Au moins 2 sessions', () => pm.expect(pm.response.json().total).to.be.at.least(2));
    language: text/javascript
order: 2000
