$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{clientEmail}}",
      "password": "Shop2026Pass"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Statut 200', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('clientToken', pm.response.json().token);
    language: text/javascript
order: 7000
