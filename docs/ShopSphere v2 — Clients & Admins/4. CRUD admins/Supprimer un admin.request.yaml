$kind: http-request
url: "{{baseUrl}}/api/admin/admins/{{adminId}}"
method: DELETE
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Statut 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 6000
