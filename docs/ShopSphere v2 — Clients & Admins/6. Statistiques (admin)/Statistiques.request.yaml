$kind: http-request
url: "{{baseUrl}}/api/admin/stats?days=7"
method: GET
headers:
  Content-Type: application/json
queryParams:
  days: "7"
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Statut 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000
