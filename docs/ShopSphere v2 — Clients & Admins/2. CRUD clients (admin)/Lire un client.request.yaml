$kind: http-request
url: "{{baseUrl}}/api/admin/clients/{{clientId}}"
method: GET
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Statut 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
