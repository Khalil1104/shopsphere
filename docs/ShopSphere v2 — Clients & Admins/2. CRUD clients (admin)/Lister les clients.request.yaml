$kind: http-request
url: "{{baseUrl}}/api/admin/clients?page=1&limit=10&search="
method: GET
headers:
  Content-Type: application/json
queryParams:
  page: "1"
  limit: "10"
  search: ""
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Statut 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000
